name: JReactive E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      image: mcr.microsoft.com/playwright/java:v1.58.0-noble
      options: --user 1001

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar proyecto
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Ejecutar pruebas
        run: mvn -B test --no-transfer-progress

      - name: Mostrar reportes si falla
        if: failure()
        run: |
          echo "===== SUREFIRE REPORTS ====="
          find target/surefire-reports -type f -print -exec cat {} \; || true

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore