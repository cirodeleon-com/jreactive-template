name: JReactive E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn -B -DskipTests install --no-transfer-progress

      - name: Instalar browsers de Playwright
        run: mvn -B -Dexec.classpathScope=test exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium" --no-transfer-progress

      - name: Ejecutar pruebas
        run: mvn -B test --no-transfer-progress

      - name: Mostrar reportes si falla
        if: failure()
        run: |
          echo "===== SUREFIRE REPORTS ====="
          find target/surefire-reports -type f -print -exec cat {} \; || true

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore